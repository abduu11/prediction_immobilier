# Configuration du projet — prix au m² (DVF)
data:
  base_url: "https://files.data.gouv.fr/geo-dvf/latest/csv"
  departement: "33"          # MVP : Gironde
  years: [2021, 2022, 2023, 2024, 2025]
  raw_dir: "data/raw"
  manifest: "data/manifest.json"   # date de téléchargement, taille, SHA-256 par fichier
  processed_dir: "data/processed"

clean:
  surface_bounds:                  # surface_reelle_bati (m²)
    Appartement: [9, 500]
    Maison: [20, 1000]
  pieces_bounds: [1, 15]
  min_valeur_fonciere: 15000       # exclut les prix symboliques
  max_surface_terrain_maison: 10000  # exclut les maisons vendues avec de grands terrains
  prix_m2_bounds: [200, 25000]     # garde-fous absolus (non estimés sur les données)
  quantile_bounds: [0.01, 0.99]    # P1-P99 par type : à ajuster sur le TRAIN uniquement (sprint 3)
  report_dir: "reports"

split:                             # découpage temporel (sur date_mutation)
  train_years: [2021, 2022, 2023]
  valid_years: [2024]
  test_years: [2025]               # touché une seule fois, à la toute fin

baseline:
  min_ventes_commune: 5            # en dessous : repli sur la médiane du type de bien

final:                             # évaluation finale (test) et fourchette de prix
  model: "hgb_geo"                 # modèle retenu d'après la VALIDATION 2024
  coverage: 0.8                    # part visée de ventes dans la fourchette

spatial:                           # validation spatiale (GroupKFold)
  n_splits: 5
  block_km: 5                      # côté des blocs carrés du second schéma
